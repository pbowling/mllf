# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the OS, Python version, and other tools you might need
build:
  os: ubuntu-24.04
  tools:
    python: "3.11"
  image: latest

# Build documentation using the project's top-level conf.py
sphinx:
  configuration: conf.py

python:
  install:
    - method: pip
      path: .
    - requirements: docs/requirements.txt

# ReadTheDocs expects builds to write to the environment-provided output
# path. Avoid committing _build/html into the repo; RTD will use
# $READTHEDOCS_OUTPUT/html as the output directory.
        

