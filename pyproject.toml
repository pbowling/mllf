[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mllf"
dynamic = ["version"]
description = "Machine-learned bias coefficients for multisite lambda dynamics"
readme = "README.md"
license = {text = "MIT"}
authors = [ {name = "Paige E. Bowling", email = "pbowling@umich.edu"} ]
maintainers = [ {name = "Paige E. Bowling", email = "pbowling@umich.edu"} ]
keywords = ["machine learning", "neural networks", "molecular dynamics", "multisite lambda dynamics"]
# X | None annotations (generate_combinations) need 3.10.
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
]

dependencies = [
    "numpy>=1.24",
    "torch>=2.0",
    "pyyaml>=6.0",
    "rdkit>=2022.9.1",
    "unimol_tools>=0.1.6",
]

[project.scripts]
mllf = "mllf.cli.main:main"

[project.urls]
"Repository" = "https://github.com/pbowling/mllf"

[project.optional-dependencies]
analysis = [
    "matplotlib>=3.7",
    "pandas>=1.5",
    "pillow",
]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "flake8",
    "isort",
    "pre-commit",
]

[tool.setuptools.dynamic]
version = {attr = "mllf.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q -ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.isort]
# Import order: standard library, third party, mllf; one name per line when wrapped.
profile = "black"
line_length = 99
known_first_party = ["mllf"]
src_paths = ["src", "tests"]
extend_skip = ["examples", "tests/samples"]
extend_skip_glob = ["src/mllf/analysis/style.py"]   # the author's bowling_style.py, unchanged
lines_after_imports = 2

# flake8 does not read pyproject.toml; its settings are in .flake8.
