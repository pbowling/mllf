[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mllf"
version = "0.1.0"
description = "MLLF bias coefficient file handling"
readme = "README.md"
license = {text = "MIT"}
authors = [ {name = "Paige E. Bowling", email = "pbowling@umich.edu"} ]
maintainers = [ {name = "Paige E. Bowling", email = "pbowling@umich.edu"} ]
keywords = ["machine learning", "neural networks", "molecular dynamics", "multisite lambda dynamics"]
# X | None annotations (generate_combinations) need 3.10.
requires-python = ">=3.10"

dependencies = [
    "numpy>=1.24",
    "torch>=2.0",
    "pyyaml>=6.0",
    "rdkit>=2022.9.1",
    "unimol_tools>=0.1.6",
]

[project.urls]
"Repository" = "https://github.com/pbowling/mllf"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "flake8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q -ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

# flake8 does not read pyproject.toml; its settings are in .flake8.
