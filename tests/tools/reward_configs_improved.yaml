# Improved reward function configurations with tiered transition penalties
# Use with: python test_reward_improved.py pretraining/indolizine_solv --configs reward_configs_improved.yaml --good-threshold 215 --bad-threshold 15
#
# Tiered Transition Penalty System (per site):
# - Tier 1 "Death Floor" (0 trans): -40.0 penalty
# - Tier 2 "Climbing Ramp" (1-9 trans): -30.2 to -7.8 (linear gradient)
# - Tier 3 "Success Zone" (≥10 trans): 0.0 penalty, unlocks R_T reward
#
# New mechanisms:
# - Penalty Shield (I_dead): Disables secondary penalties when min_transitions = 0
# - Confidence Factor (C_F): Scales R_P by min(1.0, min_transitions / (2*N_req))

# Current workflow_14benz training configuration
current_training:
  w_P: 0.5
  w_T: 0.75
  w_U: 0.3
  gamma: 4.0
  P_baseline: 500.0
  T_baseline: 50.0
  min_transitions_per_site: 10
  min_coverage_ratio: 0.5
  entropy_bonus: 8.0
  concentration_penalty_threshold: 0.8

