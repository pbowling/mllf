# Improved reward function configurations for testing
# Use with: python test_reward_improved.py pretraining/indolizine_solv --configs reward_configs_improved.yaml

# Current default configuration
current_default:
  w_P: 0.4
  w_T: 0.4
  w_U: 0.2
  gamma: 5.0
  P_baseline: 1000.0
  T_baseline: 100.0
  min_transitions_per_site: 10
  min_coverage_ratio: 0.5
  entropy_bonus: 5.0
  concentration_penalty_threshold: 0.8

# Stronger positive rewards
higher_baselines:
  w_P: 0.4
  w_T: 0.4
  w_U: 0.2
  gamma: 5.0
  P_baseline: 500.0  # Lower baseline = higher normalized rewards
  T_baseline: 50.0
  min_transitions_per_site: 10
  min_coverage_ratio: 0.5
  entropy_bonus: 5.0
  concentration_penalty_threshold: 0.8

higher_entropy_bonus:
  w_P: 0.4
  w_T: 0.4
  w_U: 0.2
  gamma: 5.0
  P_baseline: 1000.0
  T_baseline: 100.0
  min_transitions_per_site: 10
  min_coverage_ratio: 0.5
  entropy_bonus: 10.0  # Double entropy bonus
  concentration_penalty_threshold: 0.8

higher_weights:
  w_P: 0.5  # Increase positive component weights
  w_T: 0.5
  w_U: 0.3
  gamma: 5.0
  P_baseline: 1000.0
  T_baseline: 100.0
  min_transitions_per_site: 10
  min_coverage_ratio: 0.5
  entropy_bonus: 5.0
  concentration_penalty_threshold: 0.8

# More lenient penalties
weaker_penalties:
  w_P: 0.4
  w_T: 0.4
  w_U: 0.2
  gamma: 3.0  # Reduce penalty strength
  P_baseline: 1000.0
  T_baseline: 100.0
  min_transitions_per_site: 10
  min_coverage_ratio: 0.5
  entropy_bonus: 5.0
  concentration_penalty_threshold: 0.8

relaxed_requirements:
  w_P: 0.4
  w_T: 0.4
  w_U: 0.2
  gamma: 5.0
  P_baseline: 1000.0
  T_baseline: 100.0
  min_transitions_per_site: 5  # Lower threshold
  min_coverage_ratio: 0.3  # Lower coverage requirement
  entropy_bonus: 5.0
  concentration_penalty_threshold: 0.8

# Balanced: higher rewards + weaker penalties
balanced_positive:
  w_P: 0.5
  w_T: 0.5
  w_U: 0.3
  gamma: 4.0
  P_baseline: 500.0
  T_baseline: 50.0
  min_transitions_per_site: 10
  min_coverage_ratio: 0.5
  entropy_bonus: 8.0
  concentration_penalty_threshold: 0.8

# Strong positive emphasis
very_positive:
  w_P: 0.6
  w_T: 0.6
  w_U: 0.4
  gamma: 3.0
  P_baseline: 400.0
  T_baseline: 40.0
  min_transitions_per_site: 10
  min_coverage_ratio: 0.5
  entropy_bonus: 12.0
  concentration_penalty_threshold: 0.8

# Moderate adjustments
moderate_positive:
  w_P: 0.45
  w_T: 0.45
  w_U: 0.25
  gamma: 4.0
  P_baseline: 750.0
  T_baseline: 75.0
  min_transitions_per_site: 10
  min_coverage_ratio: 0.5
  entropy_bonus: 7.0
  concentration_penalty_threshold: 0.8

# Focus on transitions (good runs have many transitions)
