name: Release

# Publishing a GitHub release (tag vX.Y.Z) builds the sdist and wheel and uploads
# them to PyPI. Uploads use PyPI trusted publishing, so no API token is stored:
# on pypi.org, add a trusted publisher for this repository, workflow release.yml,
# environment "pypi". Run it by hand (workflow_dispatch) to send a build to TestPyPI
# first; that needs the same publisher set up on test.pypi.org.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Tag matches the package version
        if: github.event_name == 'release'
        run: |
          version=$(python -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('src/mllf/__init__.py').read()).group(1))")
          test "${GITHUB_REF_NAME#v}" = "$version" || { echo "tag $GITHUB_REF_NAME != __version__ $version"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
