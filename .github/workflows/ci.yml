name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # isort, flake8 and file hygiene, as in .pre-commit-config.yaml
      - uses: pre-commit/action@v3.0.1

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CPU-only torch
        run: |
          python -m pip install --upgrade pip build
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Build and install the wheel
        # tests run against the installed package, not src/
        run: |
          python -m build --wheel
          pip install "$(ls dist/*.whl)[analysis]" pytest
      - name: Command line
        run: |
          mllf --version
          mllf -h
      - name: Tests
        run: python -m pytest -o pythonpath= tests

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[analysis]" -r docs/requirements.txt
      - name: Build docs
        run: sphinx-build -b html . _build/html
