# Combination generation (comment out after first run to reuse existing combos)
create_combos:
  input_dir: /home/pbowling/mllf/examples/14benz
  out_dir: /home/pbowling/mllf/examples/14benz/generated_combos
  include_patterns:
    - msld_flat.py

# Train/val/test split
split:
  train_frac: 0.10  # 10% for training
  val_frac: 0.01    # 1% for validation
  seed: 42

# Pretraining (optional - load pretrained policy before training)
# Run pretraining with: python -m mllf.cb.pretrain_policy
pretrain:
  model_path: /home/pbowling/mllf/examples/models/pretrained_combined/best_policy.pt
  # Set to path of best_policy.pt after running pretrain_policy to use it

# Atom type vocabulary configuration (for node feature encoding)
vocabulary:
  # Path to toppar directory (None uses package default: toppar/)
  toppar_dir: null
  # List of specific toppar files to include (None includes all .rtf and .str files)
  # Example: ['top_all36_cgenff.rtf', 'top_all36_prot.rtf']
  toppar_files: null
  # Warn when substituent RTF files contain atom types not in vocabulary
  warn_missing_types: true

# Curriculum learning configuration (progressive training complexity)
curriculum:
  enabled: true  # Set to false to train on all combinations without curriculum
  stages:
    # Stage 1: Start with pairs (2 subs) at single site
    - name: pairs_single_site
      min_subs: 2
      max_subs: 2
      min_sites: 1
      max_sites: 1
      epochs: 25
      
    # Stage 2: Triplets at single site
    - name: triplets_single_site
      min_subs: 3
      max_subs: 3
      min_sites: 1
      max_sites: 1
      epochs: 20
      
    # Stage 3: Quadruplets at single site
    - name: quadruplets_single_site
      min_subs: 4
      max_subs: 4
      min_sites: 1
      max_sites: 1
      epochs: 10
      
    # Stage 4: 5 subs at single site
    - name: quintuplets_single_site
      min_subs: 5
      max_subs: 5
      min_sites: 1
      max_sites: 1
      epochs: 10
      
      
    # Stage 5: Pairs across two sites (2 subs each)
    - name: pairs_two_sites
      min_subs: 4  # 2 from each site
      max_subs: 4
      min_sites: 2
      max_sites: 2
      epochs: 25
      
    # Stage 6: More complex two-site combinations
    - name: complex_two_sites
      min_subs: 5
      max_subs: 8
      min_sites: 2
      max_sites: 2
      epochs: 25
      
    # Stage 7: Full complexity
    - name: full_complexity
      min_subs: 2
      max_subs: 20  # No practical limit
      min_sites: 1
      max_sites: 10
      epochs: 25
  
  # Progression criteria (optional - when to advance to next stage)
  progression:
    type: epoch  # Options: 'epoch' (fixed epochs), 'reward' (reward threshold), 'both'
    reward_threshold: 0.0  # Minimum avg reward to advance (if type='reward' or 'both')

# Training configuration
training:
  num_epochs: 50  # Total epochs (ignored if curriculum is enabled)
  encoder:
    hidden_dims: [64, 64]
    out_dim: 32
  policy:
    mlp_hidden: 64
  optimizer:
    lr: 0.001
  bias_clip: 1000.0  # Maximum absolute value for bias coefficients
  
# Simulation configuration
run_sims: true
wait_for_jobs: true  # Wait for jobs to complete before computing rewards
max_concurrent_jobs: 60  # Maximum SLURM jobs running simultaneously
timeout: 1200  # 20 minutes per simulation

# Reward configuration (scalarized reward function)
# Note: Raw simulation metrics (populations, transitions) are saved in checkpoints.
# If you change reward parameters, cached results will be automatically recomputed
# using the new configuration without re-running simulations. This allows testing
# different reward functions on the same simulation data ("pretraining" mode).
reward:
  # Weights for normalized terms (higher_rewards_v1 configuration)
  w_P: 0.5              # Weight for population term
  w_T: 0.5              # Weight for transition term
  w_U: 0.3              # Weight for uniformity term
  
  # Scaling and bonuses
  gamma: 4.0            # Scaling factor for coverage/concentration penalties
  entropy_bonus: 8.0    # Bonus for uniform distributions
  
  # Baseline normalization values (lower = higher normalized rewards)
  P_baseline: 500.0     # Expected maximum total population
  T_baseline: 50.0      # Expected maximum total transitions
  
  # Tiered transition penalty system (per site):
  # - Tier 1 "Death Floor" (0 trans): -40.0 penalty
  # - Tier 2 "Climbing Ramp" (1-9 trans): -30.2 to -7.8 (linear gradient)
  # - Tier 3 "Success Zone" (≥10 trans): 0.0 penalty, unlocks R_T reward
  min_transitions_per_site: 10        # Transition threshold for Tier 3
  
  # Additional constraints
  min_coverage_ratio: 0.5             # Minimum ratio of substituents visited (0.5 = 50%)
  concentration_penalty_threshold: 0.8  # Threshold for concentration penalty (0.8 = 80%)
  
  # REINFORCE entropy regularization
  lambda_entropy: 0.01  # Entropy coefficient for exploration

# Output organization
output:
  base_dir: /home/pbowling/mllf/examples/cb/training_output
  save_checkpoints: true
  checkpoint_freq: 5  # Save checkpoint every 5 epochs

# Archive completed combinations (compress after training)
archive:
  enabled: false              # Set to true to archive combinations
  pattern: 'comb_*'          # Glob pattern for directories to archive
  remove_after: false        # Remove original directories after archiving
  archive_dir: /home/pbowling/mllf/examples/cb/archives  # Where to store .tar.gz files

