# Workflow configuration for 14benz training
# This example has 2 sites: site1 (6 subs) and site2 (5 subs)
# No atoms need to be deleted for single-site combinations

# System configuration
system:
  solvent_state: solv  # Environment type: 'solv' (solvated), 'gas' (vacuum), or 'protein'

# Combination generation
create_combos:
  input_dir: /home/pbowling/mllf/examples/14benz
  out_dir: /home/pbowling/mllf/examples/14benz/generated_combos_with14benz
  include_patterns:
    - msld_flat.py

# Train/val/test split
split:
  train_frac: 0.95  # 95% for training
  val_frac: 0.05    # 5% for validation
  seed: 16

pretrain:
  model_path: /home/pbowling/mllf/examples/models/pretraining_with14benz/best_policy.pt

# Warm-start configuration: at epoch 0, use pretraining biases instead of sampling
# from the policy.  Build the mapping file with:
#   python examples/build_warmstart_map.py \
#     --pretrain-dir /home/pbowling/mllf/pretraining/14benz_solv \
#     --nsubs-per-site 6 5 \
#     --output /home/pbowling/mllf/examples/models/warmstart_14benz_solv.json
# Set mapping_path to null (or omit this block) to disable.
warmstart:
  mapping_path: /home/pbowling/mllf/examples/models/warmstart_14benz_solv.json
  epoch: 0  # Which epoch receives warm-start biases (default 0)

# AtomBondGNN encoder configuration (pretrained, frozen during all training phases)
deepset:
  encoder_path: /home/pbowling/mllf/pretraining/deepset_pretraining_output/trained_models/best_encoder.pt

# Curriculum learning configuration (progressive training complexity)
curriculum:
  enabled: true
  # Optional: Limit number of training combos per stage (useful for later stages with many combos)
  # If not set or null, uses all combos that match stage criteria
  max_train_combos_per_stage: 250  # e.g., 100 to limit to 100 random combos per stage
  
  stages:
    # 1. WARM UP: Learn graphs most like what the model saw during pretraining
    - name: similar_to_pretraining
      min_sites: 1
      max_sites: 1
      min_subs_per_site: 3
      max_subs_per_site: 4
      epochs: 2
      # Optional: Override max_train_combos for this specific stage
      # max_train_combos: 50
      # Override reward parameters for easier early learning
      reward_override:
        min_transitions_per_site: 3  # Lower threshold 

    # 2. EXPANSION: Try less similar combos to encourage generalization
    # - name: expand_combo_space
    #   min_sites: 2
    #   max_sites: 2
      # min_subs_per_site: 5
      # max_subs_per_site: 6
      # epochs: 25
      # reward_override:
      #   min_transitions_per_site: 3  # Lower threshold
  
  # Progression criteria (advance after fixed epochs)
  progression:
    type: epoch

# Atom type vocabulary configuration (for node feature encoding)
vocabulary:
  # Path to toppar directory (None uses package default: toppar/)
  toppar_dir: null
  # List of specific toppar files to include (None includes all .rtf and .str files)
  # Example: ['top_all36_cgenff.rtf', 'top_all36_prot.rtf']
  toppar_files: null
  # Warn when substituent RTF files contain atom types not in vocabulary
  warn_missing_types: true

# Training configuration
# Policy architecture: Separate heads with bias-type embeddings for forced specialization
# - Shared trunk: 1 layer with ReLU (lightweight, extracts basic edge features)
# - Bias-type embeddings: Learnable 16-dim vectors (one per bias type)
#   Provides unique context to each head, forcing independent specialization
# - Separate heads: Deep 3-layer networks per bias type (quadratic, skew, end, linear)
#   Input: [trunk_output (64-dim), bias_type_embedding (16-dim)] = 80-dim
#   Architecture: Linear(80,64) -> ReLU -> Linear(64,32) -> ReLU -> Linear(32,2)
#   Each head receives DIFFERENT input due to unique bias embedding
# - Output scaling: Full-range via tanh - [Linear ±305, Quadratic ±520, Skew ±85, End ±30]
#   Scale factors cover empirical maxima across 20K+ pretraining runs with ~10% headroom.
# - Exploration: log_std clamped to [-20, 2.0] (std up to ~7.4)
# - Action clipping: Sampled actions clipped to tanh scaling limits × 1.05 to prevent extreme outliers
training:
  encoder:
    hidden_dims: [64, 64]  # RGCN hidden layers for node embeddings
    out_dim: 32             # Node embedding dimension
  policy:
    mlp_hidden: 64          # Hidden units in shared trunk (before separate heads)
    # mlp_out_dim: 4        # Auto-computed: number of bias types (typically 4)
  value_network:
    hidden_dims: [64, 32]   # MLP layers for value prediction
    lr: 0.001               # Learning rate for value network (10x policy LR for faster baseline learning)
  optimizer:
    lr: 0.0001              # Learning rate for Adam optimizer (reduced 10x for stability)
  bias_clip: 1000.0         # Outer safety net for write_variables; policy clips actions to ~[±320, ±546, ±89, ±31.5]
  
# Simulation configuration
run_sims: true
wait_for_jobs: true  # Wait for jobs to complete before computing rewards
max_concurrent_jobs: 100  # Maximum SLURM jobs running simultaneously
timeout: 600  # 10 minutes per simulation (matches SLURM --time=00:10:00)

# Reward configuration (improved reward function with graduated transition penalties)
reward:
  # Weights for normalized terms
  w_P: 0.5              # Weight for population term
  w_T: 0.75             # Weight for transition term (increased from 0.5)
  w_U: 0.3              # Accepted but unused in current formula; coverage handled by coverage_factor quadratic
  
  # Scaling and bonuses
  gamma: 4.0            # Scaling factor for coverage/concentration penalties
  entropy_bonus: 8.0    # Bonus for uniform distributions
  
  # Baseline normalization values (lower = higher normalized rewards)
  P_baseline: 500.0     # Expected maximum total population
  T_baseline: 50.0      # Expected maximum total transitions
  
  # Graduated transition penalty system (per site):
  # - 0 transitions: -40.0 penalty (death floor - zero activity)
  # - 1 transition: -32.0 penalty (very low activity)
  # - 2 transitions: -24.0 penalty (very low activity)
  # - 3-9 transitions: -2.0 - (2.0 × deficit) penalty (climbing ramp)
  # - ≥10 transitions: 0.0 penalty, unlocks R_T reward (success zone)
  min_transitions_per_site: 10        # Transition threshold for success zone
  floor_mask_min_transitions: 2       # Min transitions per site to include in REINFORCE; below this
                                      # the combo is excluded from policy gradient (value network
                                      # still trains on it). Must be < min_transitions_per_site.
  
  # Additional constraints
  min_coverage_ratio: 0.5             # Minimum ratio of substituents visited (0.5 = 50%)
  concentration_penalty_threshold: 0.8  # Threshold for concentration penalty (0.8 = 80%)
  
  # REINFORCE entropy regularization
  lambda_entropy: 0.5   # Entropy coefficient for exploration

# Output organization
output:
  base_dir: /home/pbowling/mllf/examples/14benz/training_output_with14benz
  save_checkpoints: true
  checkpoint_freq: 5  # Save checkpoint every 5 epochs

# Archive completed combinations (compress during/after training)
# Archiving options:
#   per_stage=false: Archive once at the end of all training
#   per_stage=true: Archive at end of each curriculum stage (runs in background during next stage setup)
archive:
  enabled: true               # Set to true to archive combinations
  per_stage: true             # Archive at end of each curriculum stage (runs in background)
  pattern: 'comb_*'          # Glob pattern for directories to archive (unused with per_stage=true)
  remove_after: false        # Remove original directories after archiving
  archive_dir: /home/pbowling/mllf/examples/14benz/archives_with14benz  # Where to store .tar.gz files
