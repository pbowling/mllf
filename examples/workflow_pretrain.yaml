# Pretraining configuration for MSLD policy using Uni-Mol embeddings
# This config is used for supervised pretraining on collected simulation data.
# Trains UnimolPolicy to predict bias coefficients from best runs using MSE loss.
# After pretraining, use workflow_14benz.yaml or workflow_deepset.yaml with pretrain.model_path set

# ============================================================================
# STRUCTURE REPRESENTATION SETTINGS
# ============================================================================
# Controls which molecular structures are used to compute Uni-Mol embeddings
# This allows training with diverse structural conformations (minimized vs unrelaxed)
unimol:
  structure_selection: unrelaxed
    # Options:
    # - 'minimized': Use minimized structures from pretraining (default, fastest, consistent)
    # - 'unrelaxed': Use unrelaxed structures (auto-detected from pretraining directory)
    # - 'random': Randomly select minimized or unrelaxed per run
    #
    # Unrelaxed structures are auto-detected in this priority:
    # 1. Check unrelaxed_system_mappings (explicit config overrides)
    # 2. Check pretraining/prep/unrelaxed/ subdirectory
    # 3. Check pretraining/prep/original/ subdirectory
    # 4. Use pretraining/prep/ directly if PDB files present
  
  unrelaxed_system_mappings: null
    # Dict mapping pretraining system names to unrelaxed system paths
    # OPTIONAL: Only needed if auto-detection fails
    # Example:
    #   indolizine_prot: /home/pbowling/mllf/training/systems/indolizine_prot/prep
    #   indolizine_solv: /home/pbowling/mllf/training/systems/indolizine_solv/prep
    # If null, automatic detection attempted
  
  skip_unrelaxed_for_systems: ['thrombin_solvent_group']
    # List of system name patterns to skip unrelaxed structures for
    # Useful when unrelaxed structures are not properly centered or prepared
    # For these systems, only minimized structures will be used (even with structure_selection: random)
    # Example: ['thrombin_solvent']  # Skip unrelaxed for all thrombin_solvent* systems
    # Patterns are matched as: if pattern in system_name.lower()
  
  environment_cutoff: 8.0
    # Distance cutoff for including environment atoms around the ligand
    # Default: 8.0 Ångströms (increased from 5.0 for more environmental context)
    # Larger values capture more molecular context but increase computation
  
  custom_environment_paths: null
    # Dict mapping system solvent_state to custom environment PDB search paths
    # Useful for systems with nested PDB structures (e.g., indolizine_prot)
    # Example:
    #   protein: ['pdb/protein.pdb']
    #   solv: ['solvent.pdb']
    # If null, standard fallback chain used (minimized.pdb → protein.pdb → solvent.pdb)
  
  cache_embeddings: true
    # If true, save computed Uni-Mol embeddings to disk for fast reloading.
    # Does NOT speed up epochs within a single run (those already reuse an
    # in-memory per-system cache) -- what this buys is skipping the ~6h+
    # embedding pre-build phase entirely on a RESUBMITTED/rerun job (e.g.
    # after hitting a SLURM time limit), since it's persisted to cache_dir.

  cache_dir: /home/pbowling/mllf/pretraining/embeddings_cache
    # Path to embedding cache directory. Explicit absolute path (rather than
    # the <pretraining_dir>/embeddings_cache/ default) since this config is
    # invoked with many separate --pretraining-dir args (one per system/combo)
    # -- a single shared cache dir here means every system's embeddings land
    # in one place instead of scattered across thousands of per-combo dirs.
  
  use_environment_consensus: true
    # If true, build consensus environment atoms for each site using the core scaffold
    # to define which environment atoms are relevant. This ensures consistent environment
    # representation across pretraining, analysis, and online training.
    # Default: true (recommended for consistent environment filtering)
    # 
    # NOTE: Environment is now always defined by core scaffold coordinates (8Å cutoff),
    # not by consensus across substituents. This provides stable, consistent filtering
    # across all three pipelines.

# ============================================================================
# POLICY ARCHITECTURE
# ============================================================================
# UnimolPolicy: Pre-computed Uni-Mol 512D molecular representations
#   Input: [unimol_sub, unimol_core] = 1024D per edge
#   Projection: 1024D → 512D → 256D (progressive reduction)
#   EdgeValueMLP: 256D → 64D hidden → 4 bias types
#   
# Uni-Mol model: unimol_tools.UniMolRepr with model_name='unimolv1', model_size='84m'
# Trained on: 1.1B molecules from PubChem (rich learned representations)
# No AtomBondGNN, no site pooling — pure pre-trained molecular context

policy_type: unimol  # Fixed to unimol (only supported policy)

# Training configuration
training:
  # UnimolPolicy hyperparameters
  unimol:
    unimol_dim: 512           # Uni-Mol embedding dimension (from pretrained model)
    mlp_hidden: 64            # EdgeValueMLP hidden units (256 → 64 in BiasHeadMLP)
  
  # Shared optimizer settings
  optimizer:
    lr: 0.0001                # Learning rate (reduced for gradient stability through projection layers)
  bias_clip: 1000.0           # Safety net for coefficient clipping at inference

# Reward configuration (improved reward function with graduated transition penalties)
reward:
  # Reward component weights
  w_P: 0.5              # Weight for population distribution
  w_T: 0.75             # Weight for transition counts (increased from 0.5)
  w_U: 0.3              # Accepted but unused in current formula; coverage handled by coverage_factor quadratic
  
  # Scaling and bonuses
  gamma: 4.0            # Scaling factor for coverage/concentration penalties
  entropy_bonus: 8.0    # Bonus for uniform distributions
  
  # Baseline normalization values (lower = higher normalized rewards)
  P_baseline: 500.0     # Expected maximum total population
  T_baseline: 50.0      # Expected maximum total transitions
  
  # Graduated transition penalty system (per site):
  # - 0 transitions: -40.0 penalty (death floor - zero activity)
  # - 1 transition: -32.0 penalty (very low activity)
  # - 2 transitions: -24.0 penalty (very low activity)
  # - 3-9 transitions: -2.0 - (2.0 × deficit) penalty (climbing ramp)
  # - ≥10 transitions: 0.0 penalty, unlocks R_T reward (success zone)
  min_transitions_per_site: 10        # Transition threshold for success zone
  
  # Additional constraints
  min_coverage_ratio: 0.5             # Minimum ratio of substituents visited (0.5 = 50%)
  concentration_penalty_threshold: 0.8  # Threshold for concentration penalty (0.8 = 80%)

# Atom type vocabulary configuration
vocabulary:
  toppar_dir: null              # None uses package default (toppar/)
  toppar_files:                 # Explicit list to ensure consistent vocab size
    - top_all36_cgenff.rtf      # Standard CGenFF types (CG2R61, HGA1, etc.)
    - custom_ligand_types.rtf    # Custom/MSLD-style types (e.g. Luis benchmark systems)
  warn_missing_types: true      # Warn when sub RTF contains unknown atom types

# Note: Other sections (split, run_sims, output, etc.) are not used during pretraining
# Pretraining only needs the model architecture and reward function parameters
