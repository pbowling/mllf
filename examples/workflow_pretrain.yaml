# Pretraining configuration for MSLD policy (Behavior Cloning)
# This config is used for supervised pretraining on collected simulation data
# Trains policy to predict bias coefficients from best runs using MSE loss
# After pretraining, use workflow_sample.yaml with pretrain.model_path set

# Training configuration (must match your main workflow config)
# Architecture: Bias-type embeddings + separate heads for forced specialization
# - Shared trunk: 1 layer (lightweight)
# - Bias-type embeddings: Learnable 16-dim vectors providing unique context per head
# - Separate heads: Deep 3-layer networks receiving [trunk_out, bias_embedding]
# - Output scaling: [Linear ±79, Quadratic ±163, Skew ±11, End ±7]
# - Exploration: log_std max = 2.0 (std up to ~7.4)  
# - Action clipping: Enforces scaling limits × 1.05
# mlp_out_dim is automatically computed from relation_names (typically 4: quadratic, skew, end, linear)
training:
  encoder:
    hidden_dims: [64, 64]  # RGCN hidden layers
    out_dim: 32             # Node embedding dimension
  policy:
    mlp_hidden: 64          # Hidden units in shared trunk (before separate heads)
    # mlp_out_dim: 4        # Auto-computed: number of bias types (quadratic, skew, end, linear)
  optimizer:
    lr: 0.001
  bias_clip: 1000.0         # Safety net (policy clips to [±83, ±171, ±11.6, ±7.4] per bias type)

# Reward configuration (improved reward function with tiered transition penalties)
# Using higher_rewards_v1 configuration
reward:
  # Reward component weights (higher_rewards_v1 configuration)
  w_P: 0.5              # Weight for population distribution
  w_T: 0.5              # Weight for transition counts
  w_U: 0.3              # Weight for uniformity/entropy
  
  # Scaling and bonuses
  gamma: 4.0            # Scaling factor for coverage/concentration penalties
  entropy_bonus: 8.0    # Bonus for uniform distributions
  
  # Baseline normalization values (lower = higher normalized rewards)
  P_baseline: 500.0     # Expected maximum total population
  T_baseline: 50.0      # Expected maximum total transitions
  
  # Tiered transition penalty system (per site):
  # - Tier 1 "Death Floor" (0 trans): -40.0 penalty
  # - Tier 2 "Climbing Ramp" (1-9 trans): -30.2 to -7.8 (linear gradient)
  # - Tier 3 "Success Zone" (≥10 trans): 0.0 penalty, unlocks R_T reward
  min_transitions_per_site: 10        # Transition threshold for Tier 3
  
  # Additional constraints
  min_coverage_ratio: 0.5             # Minimum ratio of substituents visited (0.5 = 50%)
  concentration_penalty_threshold: 0.8  # Threshold for concentration penalty (0.8 = 80%)
  
  # Legacy parameters (for backward compatibility)
  lambda_entropy: 0.01

# Note: Other sections (split, run_sims, output, etc.) are not used during pretraining
# Pretraining only needs the model architecture and reward function parameters
