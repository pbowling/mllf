# Pairwise MLP Pretraining Configuration
# This config is used for supervised pretraining on collected simulation data
# Trains pairwise MLP to predict bias coefficients from best runs using MSE loss
# After pretraining, use workflow_train.yaml with pretrain.model_path set

# Training configuration for Pairwise MLP
# Architecture: Direct feature-to-bias prediction without graph structure
# - Input: Concatenated substituent features [feat_i, feat_j] (2*feature_dim)
# - Shared trunk: 2 layers [256, 128] with ReLU and dropout
# - Bias-type embeddings: Learnable 16-dim vectors for specialization
# - Separate heads: 3-layer networks per bias type [hidden//2 → 2]
# - Output: [mean, log_std] for each of 4 bias types
# - Output clipping: [Linear ±79, Quadratic ±163, Skew ±11, End ±7]
# - Exploration: log_std max = 2.0 (std up to ~7.4)
# Note: feature_dim is auto-detected from data (typically 364 for CGenFF vocab)
training:
  policy:
    # feature_dim: auto-detected from pretraining data
    hidden_dims: [256, 128] # Shared trunk hidden layers
    num_bias_types: 4       # Linear, quadratic, skew, end
    bias_embed_dim: 16      # Bias-type embedding dimension
    dropout: 0.1            # Dropout probability
  optimizer:
    lr: 0.001               # Learning rate
  bias_clip: 1000.0         # Safety net (policy clips to appropriate ranges)

# Reward configuration (for filtering best runs during pretraining)
# Using higher_rewards_v1 configuration
reward:
  # Reward component weights
  w_P: 0.5              # Weight for population distribution
  w_T: 0.5              # Weight for transition counts
  w_U: 0.3              # Weight for uniformity/entropy
  
  # Scaling and bonuses
  gamma: 4.0            # Scaling factor for coverage/concentration penalties
  entropy_bonus: 8.0    # Bonus for uniform distributions
  
  # Baseline normalization values
  P_baseline: 500.0     # Expected maximum total population
  T_baseline: 50.0      # Expected maximum total transitions
  
  # Tiered transition penalty system (per site)
  min_transitions_per_site: 10        # Transition threshold for Tier 3
  
  # Additional constraints
  min_coverage_ratio: 0.5             # Minimum ratio of substituents visited
  concentration_penalty_threshold: 0.8  # Threshold for concentration penalty
  
  # Legacy parameters (for backward compatibility)
  lambda_entropy: 0.01

# Note: Pretraining only needs the model architecture and reward function parameters
# Other sections (split, run_sims, output, etc.) are not used during pretraining
