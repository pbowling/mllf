# Minimal online-training example: 1,4-benzene (14benz) with a single system.
#
# Run from the repository root:
#   mllf train examples/workflow_14benz.yaml
#
# Online training always expects a top-level `systems:` list -- even for one
# system -- because one shared UnimolPolicy trains across any number of systems.
#
# This will:
#   1. Generate site1/site2 substituent combinations from examples/14benz/prep
#   2. Restrict training (via `curriculum`) to single-site pairs only, so the
#      example finishes quickly and only submits a handful of SLURM jobs/epoch
#   3. Run 5 epochs of on-policy REINFORCE from a randomly initialized policy,
#      submitting each combo's MSLD simulation as a SLURM job (see `slurm:`
#      below -- adjust for your cluster). Add a `pretrain:` block (see below)
#      to warm-start from a behavior-cloned checkpoint instead.
#   4. Save checkpoints to examples/14benz/training_output/ (rerunning the same
#      command resumes from the latest one)
#
# See docs/workflow.rst for the complete option reference.

seed: 42

# ---------------------------------------------------------------------------
# Systems list: one entry here, but the schema supports any number of systems
# training a single shared policy (see docs/workflow.rst).
# ---------------------------------------------------------------------------
systems:
  - name: 14benz_solv
    input_dir: examples/14benz
    out_dir: examples/14benz/generated_combos
    solvent_state: solv
    include_patterns: [msld_flat.py]
    max_subs_per_site: 3   # keep the combo pool small for this example

# ---------------------------------------------------------------------------
# Pretrained policy warm start (optional, off by default here). Uncomment and
# point model_path at your own behavior-cloned checkpoint -- see
# docs/cb_pretraining.rst and examples/pretrain_with_filtering.sh
# (`mllf pretrain` -> models/<run>/best_policy.pt) for how to produce one. Without this block, UnimolPolicy trains from a random
# initialization, which still works for this example, just less efficiently.
#
# pretrain:
#   model_path: models/<your_pretrain_run>/best_policy.pt
# ---------------------------------------------------------------------------
# Curriculum learning: restrict this example to the easiest stage (pairs at
# a single site) and cap combos/epoch so a full run finishes in minutes, not
# hours. Set curriculum.enabled: false and use training.num_epochs instead
# for a plain (non-curriculum) run over the whole combo pool.
# ---------------------------------------------------------------------------
curriculum:
  enabled: true
  max_train_combos_per_stage: 20
  stages:
    - name: pairs_single_site
      min_sites: 1
      max_sites: 1
      min_subs_per_site: 2
      max_subs_per_site: 2
      epochs: 5
  progression:
    type: epoch

# No held-out validation split for this tiny example (needs > 20 active
# training combos before a validation set is carved out -- see workflow.rst).
validation_fraction: 0.0

# ---------------------------------------------------------------------------
# Policy architecture (UnimolPolicy -- see :doc:`cb_setup`)
# ---------------------------------------------------------------------------
training:
  policy:
    unimol_dim: 512    # Per-embedding dimension of the pretrained Uni-Mol model
    mlp_hidden: 64     # hidden width of the edge MLP
  optimizer:
    lr: 0.0001
  bias_clip: 1000.0

# ---------------------------------------------------------------------------
# Output / checkpointing
# ---------------------------------------------------------------------------
output:
  base_dir: examples/14benz/training_output
  save_checkpoints: true
  checkpoint_freq: 1

# ---------------------------------------------------------------------------
# Simulation control
# ---------------------------------------------------------------------------
run_sims: true
wait_for_jobs: true
max_concurrent_jobs: 10
max_retries: 2
timeout: 1200   # seconds per simulation

# SLURM submission settings -- adjust partition/gres/module for your cluster.
# Each combo's simulation is submitted as its own `sbatch` job running
# msld_flat.py (CHARMM/pyCHARMM) inside the combo directory.
# partition/gres/module are all optional and omitted from the generated
# script entirely if unset -- e.g. drop `gres` on a CPU-only cluster, drop
# `module` if you don't use environment modules, drop `partition` to use
# your cluster's/account's default. `time` defaults to 01:00:00 if this
# whole block is left out.
# Any other sbatch option can be added the same way (underscores become
# dashes), e.g. `exclude: [node003]`, `qos: normal`, `mem: 8G`; `exclude_file`
# is re-read at every submission. See docs/workflow.rst (Launching Simulations).
slurm:
  partition: gpu
  gres: gpu:1
  time: '01:00:00'
  module: charmm/charmm/c51a1

# ---------------------------------------------------------------------------
# Reward function (see :doc:`workflow` for the full formula)
# ---------------------------------------------------------------------------
reward:
  w_P: 0.5
  w_T: 0.75
  w_U: 0.3
  gamma: 4.0
  entropy_bonus: 8.0
  P_baseline: 500.0
  T_baseline: 50.0
  min_transitions_per_site: 10
  no_transition_weight: 0.15
