# Workflow configuration for 14benz training
# This example has 2 sites: site1 (6 subs) and site2 (5 subs)
# No atoms need to be deleted for single-site combinations

# Combination generation
create_combos:
  input_dir: /home/pbowling/mllf/examples/14benz
  out_dir: /home/pbowling/mllf/examples/14benz/generated_combos
  include_patterns:
    - msld_flat.py

# Train/val/test split
split:
  train_frac: 0.9  # 90% for training
  val_frac: 0.1    # 10% for validation
  seed: 42

pretrain:
  model_path: /home/pbowling/mllf/examples/models/pretraining/best_policy.pt

# Curriculum learning configuration (progressive training complexity)
curriculum:
  enabled: true
  # Optional: Limit number of training combos per stage (useful for later stages with many combos)
  # If not set or null, uses all combos that match stage criteria
  max_train_combos_per_stage: null  # e.g., 100 to limit to 100 random combos per stage
  
  stages:
    # 1. WARM UP: Learning the basics with a "Leaky Gate"
    - name: pairs_single_site_easy
      min_subs: 2
      max_subs: 2
      min_sites: 1
      max_sites: 1
      epochs: 50
      # Optional: Override max_train_combos for this specific stage
      # max_train_combos: 50

    # 2. MASTERY: Perfecting the pairwise edge weights
    #- name: pairs_single_site_full
    #  min_subs: 2
    #  max_subs: 2
    #  min_sites: 1
    #  max_sites: 1
    #  epochs: 50

    # 3. DENSITY: Learning crowding effects
    #- name: triplets_single_site
    #  min_subs: 3
    #  max_subs: 3
    #  min_sites: 1
    #  max_sites: 1
    #  epochs: 75  # Increased: Density is harder than pairs

    # 4. EXTRAPOLATION: The big jump to Multi-Site
    #- name: pairs_two_sites
    #  min_subs: 4  # 2 per site
    #  max_subs: 4
    #  min_sites: 2
    #  max_sites: 2
    #  epochs: 100 # Increased: This is the hardest generalization step

    # 5. COMPLEXITY: The "Endgame"
    #- name: complex_two_sites
    #  min_subs: 5
    #  max_subs: 8
    #  min_sites: 2
    #  max_sites: 2
    #  epochs: 100
  
  # Progression criteria (advance after fixed epochs)
  progression:
    type: epoch

# Atom type vocabulary configuration (for node feature encoding)
vocabulary:
  # Path to toppar directory (None uses package default: toppar/)
  toppar_dir: null
  # List of specific toppar files to include (None includes all .rtf and .str files)
  # Example: ['top_all36_cgenff.rtf', 'top_all36_prot.rtf']
  toppar_files: null
  # Warn when substituent RTF files contain atom types not in vocabulary
  warn_missing_types: true

# Training configuration
# Policy architecture: Separate heads with bias-type embeddings for forced specialization
# - Shared trunk: 1 layer with ReLU (lightweight, extracts basic edge features)
# - Bias-type embeddings: Learnable 16-dim vectors (one per bias type)
#   Provides unique context to each head, forcing independent specialization
# - Separate heads: Deep 3-layer networks per bias type (quadratic, skew, end, linear)
#   Input: [trunk_output (64-dim), bias_type_embedding (16-dim)] = 80-dim
#   Architecture: Linear(80,64) -> ReLU -> Linear(64,32) -> ReLU -> Linear(32,2)
#   Each head receives DIFFERENT input due to unique bias embedding
# - Output scaling: Per-bias ranges via tanh - [Linear ±79, Quadratic ±163, Skew ±11, End ±7]
#   Based on analysis of 5,332 coefficients from 52 pretraining systems (95th percentile + 20%)
# - Exploration: log_std clamped to [-20, 2.0] (std up to ~7.4)
# - Action clipping: Sampled actions clipped to scaling limits × 1.05 to prevent extreme outliers
training:
  encoder:
    hidden_dims: [64, 64]  # RGCN hidden layers for node embeddings
    out_dim: 32             # Node embedding dimension
  policy:
    mlp_hidden: 64          # Hidden units in shared trunk (before separate heads)
    # mlp_out_dim: 4        # Auto-computed: number of bias types (typically 4)
  optimizer:
    lr: 0.001               # Learning rate for Adam optimizer
  bias_clip: 1000.0         # Safety net for write_variables (policy clips to [±83, ±171, ±11.6, ±7.4])
  
# Simulation configuration
run_sims: true
wait_for_jobs: true  # Wait for jobs to complete before computing rewards
max_concurrent_jobs: 60  # Maximum SLURM jobs running simultaneously
timeout: 1200  # 20 minutes per simulation

# Reward configuration (improved reward function with tiered transition penalties)
reward:
  # Weights for normalized terms
  w_P: 0.5              # Weight for population term
  w_T: 0.5              # Weight for transition term
  w_U: 0.3              # Weight for uniformity term
  
  # Scaling and bonuses
  gamma: 4.0            # Scaling factor for coverage/concentration penalties
  entropy_bonus: 8.0    # Bonus for uniform distributions
  
  # Baseline normalization values (lower = higher normalized rewards)
  P_baseline: 500.0     # Expected maximum total population
  T_baseline: 50.0      # Expected maximum total transitions
  
  # Tiered transition penalty system (per site):
  # - Tier 1 "Death Floor" (0 trans): -40.0 penalty
  # - Tier 2 "Climbing Ramp" (1-9 trans): -30.2 to -7.8 (linear gradient)
  # - Tier 3 "Success Zone" (≥10 trans): 0.0 penalty, unlocks R_T reward
  min_transitions_per_site: 10        # Transition threshold for Tier 3
  
  # Additional constraints
  min_coverage_ratio: 0.5             # Minimum ratio of substituents visited (0.5 = 50%)
  concentration_penalty_threshold: 0.8  # Threshold for concentration penalty (0.8 = 80%)
  
  # REINFORCE entropy regularization
  lambda_entropy: 0.01  # Entropy coefficient for exploration

# Output organization
output:
  base_dir: /home/pbowling/mllf/examples/14benz/training_output
  save_checkpoints: true
  checkpoint_freq: 5  # Save checkpoint every 5 epochs

# Archive completed combinations (compress after training)
archive:
  enabled: false              # Set to true to archive combinations
  pattern: 'comb_*'          # Glob pattern for directories to archive
  remove_after: false        # Remove original directories after archiving
  archive_dir: /home/pbowling/mllf/examples/14benz/archives  # Where to store .tar.gz files
