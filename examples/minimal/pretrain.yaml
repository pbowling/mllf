# Pretraining settings for the minimal example (examples/minimal/run_pipeline.sh).
#
# The unimol: settings default to those of the current pretrained model
# (515-D nodes: ligand embedding with the other sites' reference substituents,
# phase flags and site size), and workflow.yaml leaves them at the same
# defaults, as the online config must match the model. Only the embedding cache
# is set here.
unimol:
  cache_embeddings: true
  cache_dir: examples/minimal/output/embeddings_cache

# Rewards that weight the behavior-cloning loss, with online training's settings
# (docs/cb_pretraining.rst). The success gate is the end-state test by default.
reward:
  T_baseline: 20.0
  barrier_target: 2.0
  min_transitions_per_site: 10
