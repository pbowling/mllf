# DeepSet + RGCN + MLP workflow configuration
# This workflow uses the full 4-step pipeline:
# 1. Atom-Level Physical Representation (AEVs + charges + atom IDs from PDB)
# 2. Shared MLP (DeepSet feature extractor)
# 3. Permutation-Invariant Pooling (Max-pooling)
# 4. RGCN + MLP (Graph message passing and edge-based prediction)

# System configuration
system:
  solvent_state: solv  # Environment type: 'solv' (solvated), 'gas' (vacuum), or 'protein'

# Combination generation
create_combos:
  input_dir: /home/pbowling/mllf/examples/14benz
  out_dir: /home/pbowling/mllf/examples/14benz/generated_combos_deepset
  include_patterns:
    - msld_flat.py
  create_dirs_immediately: false  # Lazy creation during training

# Train/val/test split
split:
  train_frac: 0.9  # 90% for training
  val_frac: 0.1    # 10% for validation
  seed: 42

# Pretrained model (optional)
pretrain:
  model_path: null  # Set to path of pretrained DeepSetRGCNModel checkpoint if available

# DeepSet configuration (Steps 1-3 of pipeline)
deepset:
  # Step 1: Atom-level feature extraction
  aev_length: 2288              # ANI-2x AEV dimension (AEVComputer.like_2x with 11 species)
  num_atom_types: 11            # Species IDs used in AEV (H, C, N, O, F, S, Cl, Br, I, P, X/rare)
  include_charge: true          # Include atomic partial charges from RTF files
  include_atom_id: true         # Include atom type IDs (0-12 for 13 elements)
  
  # Steps 2-3: Shared MLP and GlobalAttentionPool
  embedding_dim: 64             # Output dimension after GlobalAttentionPool (substituent embedding)
  hidden_dim: 256               # Hidden dimension in shared MLP
  
  # Node feature mode
  use_deepset_only: false       # DEPRECATED: Always uses only DeepSet embeddings (64D)
                                # Spatial context (protein atoms) encoded in AEVs
                                # Environmental features (solvent state) not needed (constant within graph)

# Atom type vocabulary configuration (for optional count-based features)
vocabulary:
  toppar_dir: null              # None uses package default (toppar/)
  toppar_files: null            # None uses all .rtf and .str files in toppar_dir
                                # (includes top_all36_cgenff.rtf + custom_ligand_types.rtf)
  warn_missing_types: true      # Warn when sub RTF contains unknown atom types

# Training configuration
training:
  # RGCN encoder configuration (processes DeepSet node embeddings)
  encoder:
    hidden_dims: [64, 64]       # RGCN hidden layer dimensions
    out_dim: 32                 # Node embedding dimension after RGCN
  
  # EdgePolicy configuration (predicts bias coefficients from node pairs)
  policy:
    mlp_hidden: 64              # Hidden units in EdgeValueMLP
    # mlp_out_dim: 4            # Auto-computed: number of bias types (4)
  
  # ValueNetwork configuration (learned baseline for variance reduction)
  value_network:
    hidden_dims: [64, 32]       # MLP layers for value prediction
    lr: 0.001                   # Learning rate (typically 10x policy LR)
  
  # Optimizer
  optimizer:
    lr: 0.0001                  # Learning rate for policy
  
  # Training hyperparameters
  num_epochs: 100               # Total training epochs
  bias_clip: 1000.0             # Safety clip for variables.py writing

# Simulation configuration
run_sims: true                  # Set to false for dry run (no simulations)
wait_for_jobs: true             # Wait for jobs to complete
max_concurrent_jobs: 60         # Maximum SLURM jobs running simultaneously
timeout: 1200                   # Timeout per simulation (seconds)

# Reward configuration (same as standard workflow)
reward:
  # Weights for normalized terms
  w_P: 0.5                      # Weight for population term
  w_T: 0.75                     # Weight for transition term
  w_U: 0.3                      # Accepted but unused in current formula; coverage handled by coverage_factor quadratic
  
  # Scaling and bonuses
  gamma: 4.0                    # Scaling factor for penalties
  entropy_bonus: 8.0            # Bonus for uniform distributions
  
  # Baseline normalization
  P_baseline: 500.0             # Expected maximum total population
  T_baseline: 50.0              # Expected maximum total transitions
  
  # Transition requirements
  min_transitions_per_site: 10  # Minimum transitions for success zone
  floor_mask_min_transitions: 2  # Min transitions per site to include in REINFORCE; below this
                                 # the combo is excluded from policy gradient (value network
                                 # still trains on it). Must be < min_transitions_per_site.
  
  # Additional constraints
  min_coverage_ratio: 0.5       # Minimum fraction of substituents visited
  concentration_penalty_threshold: 0.8

  # REINFORCE entropy regularization
  lambda_entropy: 0.5           # Entropy coefficient for exploration

# Output organization
output:
  base_dir: /home/pbowling/mllf/examples/14benz/training_output_deepset
  save_checkpoints: true
  checkpoint_freq: 5            # Save checkpoint every N epochs

# Archive configuration (optional)
archive:
  enabled: false                # Set to true to archive combinations after training
  per_stage: false
  remove_after: false
  archive_dir: /home/pbowling/mllf/examples/14benz/archives_deepset
